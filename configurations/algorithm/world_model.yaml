objective: flow_matching
flow:
  convention: native_linear_t0_clean_t1_noise
  time_distribution: uniform
  time_min: 0.0
  time_max: 1.0
  loss_weighting: uniform
optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
scheduler:
  name: constant
  interval: step
training:
  batch_size: 1
  gradient_accumulation: 1
  max_steps: null             # unresolved training budget
ema:
  enabled: true
  decay: 0.9999
  update_after_step: 0
