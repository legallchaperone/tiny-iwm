# wandb sweep configuration
# this is independent of all other configurations under configurations/ folder as this is not used by the code

program: main.py
method: grid # hp search method

metric:
  goal: maximize
  name: validation/accuracy

parameters:
  # Keep this template sweep on the template's example groups now that the
  # repository default selects the world-model configuration.
  experiment:
    value: example_classification
  dataset:
    value: example_cifar10
  algorithm:
    value: example_classifier

  # Sweep params
  algorithm.lr:
    values: [1e-3, 1e-4]
  experiment.training.batch_size:
    values: [32, 64]

  # Default params
  wandb.mode:
    value: online

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - +name=example_lr${algorithm.lr}_batch${experiment.training.batch_size}
