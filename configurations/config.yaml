# M0 world-model configuration.  This file is intentionally safe to compose and
# launch locally: the experiment has no tasks until one is selected explicitly.
defaults:
  - experiment: world_model
  - algorithm: world_model
  - model: joint_dit
  - stage: bidirectional
  - representation: video_vae
  - conditioning: camera_prope
  - dataset: sana_train
  - rollout: minute
  - evaluation: subset
  - probing: "off"
  - runtime: single_gpu
  - cluster: null
  - _self_

debug: false

# Disabled is the credential-free default.  Set mode=online and entity=<entity>
# explicitly for managed logging.
wandb:
  entity: null
  project: tiny-iwm
  mode: disabled

resume: null
load: null
